services:
  starrocks:
    image: starrocks/allin1-ubuntu
    container_name: starrocks-test
    ports:
      - "19030:9030"  # MySQL protocol port (query)
      - "18030:8030"  # FE HTTP port
      - "18040:8040"  # BE HTTP port
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9030", "-u", "root", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - starrocks-fe-data:/opt/starrocks/fe/meta
      - starrocks-be-data:/opt/starrocks/be/storage

volumes:
  starrocks-fe-data:
  starrocks-be-data:
